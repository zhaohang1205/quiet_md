[package]
name = "quiet_cli"
version = "0.1.5"
edition = "2024"
description = "Command-line interface for Quiet.md, built for scripts and AI agents"
license = "MIT"
readme = "../../README.md"
authors = ["s1dashu"]

[[bin]]
name = "quiet"
path = "src/main.rs"

[dependencies]
fdl_core = { path = "../core" }
anyhow = "1.0.104"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
uuid = { version = "1.28.0", features = ["v4"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[lints]
workspace = true
